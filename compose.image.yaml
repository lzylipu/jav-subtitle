# 拉现成镜像跑：只需要改「端口」和「路径」两处，其余全部首次运行时自动创建，
# 之后登录 Web UI 在「设置」页里配（翻译接口、并发、限流、预算……）。
#
#   docker compose -f compose.image.yaml up -d
#   docker compose -f compose.image.yaml logs subtitle | grep -A6 "首次启动"
#
# 镜像由 GitHub Actions 自动构建：改代码 push 到 main 就自动测试 → 构建 → 推 Docker Hub。
# Docker Hub（主）: lzylipu/nas-subtitle-pipeline
# GHCR（镜像）    : ghcr.io/lzylipu/nas-subtitle-pipeline
services:
  subtitle:
    # 有 NVIDIA 显卡就换成 :latest-cuda（多约 1.2GB，装了 cublas/cudnn）；
    # 程序每次启动都会自己探测：有可用 GPU 就用 GPU，没有就用 CPU，不需要改这里。
    # 想用 GHCR 镜像就换成 ghcr.io/lzylipu/nas-subtitle-pipeline:latest
    image: lzylipu/nas-subtitle-pipeline:latest
    container_name: nas-subtitle
    restart: unless-stopped
    ports:
      # ① 端口：冒号左边是 NAS 上访问用的端口，被占用就改成 8001 / 9000……
      - "8000:8000"
    volumes:
      # ② 路径：冒号左边换成你自己的影片目录。
      #    必须可写——字幕写在影片同目录（片名.zh-CN.srt），程序只创建 *.srt，不动视频。
      - /volume1/video:/media
      # 数据目录：数据库、模型、登录口令都在这。目录不存在会自动建，删掉等于重装。
      - ./data:/data
    # ---- 有显卡时取消下面这段注释，把 GPU 交给容器（配合 :latest-cuda 镜像）----
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    stop_grace_period: 60s
