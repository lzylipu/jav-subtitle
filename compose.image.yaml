# 只有一条命令，镜像也只有一个。
#
#   docker compose -f compose.image.yaml up -d
#   docker compose -f compose.image.yaml logs subtitle | grep -A6 首次启动
#
# 转写固定走 CPU（本程序不做显卡加速），不需要 --gpus 之类的参数。
# 需要改的只有下面两处：端口、影片目录。
#
# 镜像由 GitHub Actions 自动构建：改代码 push 到 main 即自动测试 → 构建 → 推 Docker Hub。
# Docker Hub: lzylipu/jav-subtitle     GHCR: ghcr.io/lzylipu/jav-subtitle
services:
  subtitle:
    image: lzylipu/jav-subtitle:latest
    container_name: jav-subtitle
    restart: unless-stopped
    ports:
      # ① 端口：冒号左边是 NAS 上访问用的端口，被占用就改成 8001 / 9000……
      - "8000:8000"
    volumes:
      # ② 路径：冒号左边换成你自己的影片目录。
      #    必须可写——字幕写在影片同目录（片名.zh-CN.srt），程序只创建 *.srt，不动视频。
      - /volume1/video:/media
      # 数据目录：数据库、模型、登录口令都在这。目录不存在会自动建，删掉等于重装。
      - ./data:/data
    stop_grace_period: 60s
