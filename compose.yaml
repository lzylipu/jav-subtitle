# 本地构建版：同样只需要改「端口」和「路径」，其余首次运行自动创建。
#
#   docker compose up -d --build
#   docker compose logs subtitle | grep -A6 "首次启动"
#
services:
  subtitle:
    build: .
    image: nas-subtitle-pipeline:local
    container_name: nas-subtitle
    restart: unless-stopped
    ports:
      # ① 端口：冒号左边是 NAS 上访问用的端口，被占用就改成 8001 / 9000……
      - "8000:8000"
    volumes:
      # ② 路径：冒号左边换成你自己的影片目录。
      #    必须可写——字幕写在影片同目录（片名.zh-CN.srt），程序只创建 *.srt，不动视频。
      - /volume1/video:/media
      # 数据目录：数据库、模型、登录口令都在这。目录不存在会自动建，删掉等于重装。
      - ./data:/data
    stop_grace_period: 60s
